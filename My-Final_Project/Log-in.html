<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            /* box-sizing : border-box; */
            list-style: none;
            text-decoration: none;
        }

        html,
        body {
            height: 100%;
        }

        form {
            width: 100%;
            height: 100%;
            background-color: rgba(202, 199, 199, 0.363);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form {
            border-radius: 10px;
            width: 500px;
            height: 600px;
            background-color: rgba(13, 197, 188, 0.041);
            box-shadow: 1px 1px 20px rgb(164, 167, 167);
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }

        .form .prt-1 img {
            height: 100px;
            width: 100px;
            margin: 50px 0px 0px 190px;
            border-radius: 50%;
            box-shadow: rgba(62, 62, 158, 0.1) 0px 4px 16px,
                rgba(17, 17, 26, 0.05) 0px 8px 32px;
        }

        .form .prt-1 h2 {
            font-size: 40px;
            margin: 20px 0px 30px 160px;
            color: #11b7e0;
            font-weight: 900;
        }

        .form .prt-2 input {
            margin: 10px;
            padding: 10px;
            width: 90%;
            border-radius: 10px;
            height: 20px;
            object-fit: cover;
            border: none;
            background-color: transparent;
            border: 1px solid #597575;
            outline: none;
            color: #333;
            box-shadow: rgba(100, 98, 98, 0.1) 0px 10px 15px -3px inset,
                rgba(65, 64, 64, 0.1) 0px 4px 6px -4px;
        }

        .form .prt-2 h4 {
            margin: 10px;
            margin-top: 20px;
            font-weight: 900;
            font-size: 20px;
        }

        button {
            margin: 10px;
            margin-top: 30px;
            width: 95%;
            border-radius: 10px;
            padding: 10px 10px;
            border: none;
            background-color: #0ecedbe1;
        }

        h3 {
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            text-decoration: underline;
            color: #050d0e;
        }
    </style>
</head>

<body>
    <form>
        <div class="form" id="form">
            <div class="prt-1">
                <img src="https://w1.pngwing.com/pngs/278/853/png-transparent-line-art-nose-chatbot-internet-bot-artificial-intelligence-snout-head-smile-black-and-white.png"
                    alt="" /><br />
                <h2>LearnBot</h2>
            </div>

            <div class="prt-2">
                <h4>Email</h4>
                <input type="email" placeholder="Enter your email" />
                <h4>Password</h4>
                <input type="password" placeholder="Enter your password" />
            </div>
            <button>Log in</button><br/>
            <h3>Forget Password</h3>
        </div>
    </form>
</body>

</html>
<script>

</script>
